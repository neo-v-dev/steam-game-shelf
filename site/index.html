<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Game Shelf</title>
  <link rel="stylesheet" href="base.css">
  <link id="theme-css" rel="stylesheet" href="data/theme.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body class="sgs-root">
  <main class="sgs-page">
    <header class="site-header">
      <h1 id="site-title" class="site-title">My Game Shelf</h1>
      <p id="site-description" class="site-desc"></p>
      <div class="header-meta">
        <ul id="stats" class="stat-chips"></ul>
        <div class="header-actions">
          <a id="channel-link" class="channel-link" target="_blank" rel="noopener" hidden></a>
          <button id="lang-toggle" class="lang-toggle" type="button">English</button>
        </div>
      </div>
    </header>

    <div id="notice" class="notice-panel" hidden>
      <h2 id="notice-title" class="notice-title"></h2>
      <p id="notice-text" class="notice-text"></p>
    </div>

    <div id="controls" class="controls" hidden>
      <input id="search" class="search-input" type="search" autocomplete="off">
      <select id="filter" class="filter-select"></select>
      <select id="sort" class="sort-select"></select>
    </div>

    <ul id="grid" class="game-grid"></ul>

    <div id="empty-message" class="empty-state" hidden>
      <span id="empty-icon" class="empty-state-icon" aria-hidden="true"></span>
      <p id="empty-text" class="empty-state-text"></p>
    </div>
  </main>

  <footer class="site-footer">
    <span id="updated-at" class="footer-updated"></span>
    <span class="footer-sep">·</span>
    <a class="footer-credit" href="https://github.com/neo-v-dev/steam-game-shelf" target="_blank" rel="noopener">Powered by Steam Game Shelf</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
