<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Game Shelf</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="title-block">
        <h1 id="site-title">My Game Shelf</h1>
        <p id="site-description" class="description"></p>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button">English</button>
    </div>
    <div id="stats" class="stats"></div>
  </header>

  <main>
    <div id="notice" class="notice" hidden></div>

    <div id="controls" class="controls" hidden>
      <input id="search" class="search" type="search" autocomplete="off">
      <select id="filter" class="sort"></select>
      <select id="sort" class="sort"></select>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty-message" class="empty" hidden></p>
  </main>

  <footer class="site-footer">
    <span id="updated-at"></span>
    <span class="sep">·</span>
    <a href="https://github.com/neo-v-dev/steam-game-shelf" target="_blank" rel="noopener">Powered by Steam Game Shelf</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
